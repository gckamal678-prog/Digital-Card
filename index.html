<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMAL G.C. - VIP Digital Business Card</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card-container {
            background: linear-gradient(145deg, rgba(26, 26, 26, 0.9), rgba(10, 10, 10, 0.95));
            width: 390px;
            padding: 35px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(212, 175, 55, 0.15);
            border: 2px solid #d4af37;
            text-align: center;
            box-sizing: border-box;
            color: #fff;
            backdrop-filter: blur(10px);
        }
        .avatar-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #d4af37, #fff, #d4af37);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
        }
        .profile-name {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1.2px;
            color: #d4af37;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .profile-name i {
            font-size: 16px;
            color: #d4af37;
        }
        .profile-title {
            font-size: 12px;
            color: #bbb;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 500;
        }
        /* Vertical Link List Style */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .link-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 13px 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: left;
        }
        .link-item i {
            font-size: 18px;
            color: #d4af37;
            width: 25px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .link-item:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
        .link-item:hover i {
            transform: scale(1.2);
        }
        .footer-text {
            font-size: 10px;
            color: #777;
            letter-spacing: 1px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card-container">
